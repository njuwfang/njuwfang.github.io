<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site.author }} | {{ site.affiliation }}</title>
    <meta name="description" content="{{ site.description }}" />
    {% if site.keywords %}<meta name="keywords" content="{{ site.keywords }}" />{% endif %}
    {% if site.canonical %}<link rel="canonical" href="{{ site.canonical }}" />{% endif %}

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css"
      integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw="
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>

  <body>
    {% include navigation.html %}
    <button id="back-to-top" type="button" aria-label="Back to top">Back to Top</button>

    <div class="wrapper">
      {% include profile.html %}

      <main>
        <section>
          {{ content }}

          {% if site.enable_footnote %}
            <p class="footnote">
              <small>
                Powered by Jekyll and
                <a href="https://github.com/yaoyao-liu/minimal-light" target="_blank" rel="noopener">Minimal Light</a>
                theme.
              </small>
            </p>
          {% endif %}
        </section>
      </main>
    </div>

    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
